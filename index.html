<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbe3e8">
<title>Kritisha is Turning 7!</title>
<style>
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#fff7ef,#fbe3e8 48%,#e8f0fb);font-family:Georgia,serif;color:#382c2c;overflow-x:hidden}.wrap{width:min(100%,650px);text-align:center;padding:18px 12px 28px}.hint{font:600 14px system-ui;color:#7b6666;letter-spacing:.08em;margin-bottom:18px}.env{position:relative;width:min(94vw,560px);height:350px;margin:auto;cursor:pointer;perspective:1000px;filter:drop-shadow(0 18px 25px #6e4c4c33)}.back,.front,.flap{position:absolute;inset:0;border-radius:8px}.back{background:#f5dfc6;border:2px solid #cda86e}.front{z-index:4;background:linear-gradient(150deg,transparent 0 49%,#efd4b6 50%) bottom left/50% 100% no-repeat,linear-gradient(210deg,transparent 0 49%,#f6e1c8 50%) bottom right/50% 100% no-repeat;border:2px solid #cda86e;clip-path:polygon(0 44%,50% 76%,100% 44%,100% 100%,0 100%)}.flap{z-index:5;background:#f8e7d2;clip-path:polygon(0 0,100% 0,50% 63%);transform-origin:top;transition:transform .9s ease;backface-visibility:hidden}.seal{position:absolute;z-index:6;left:50%;top:46%;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#e7c66c,#b6842f);color:white;font:bold 30px Georgia;border:3px solid #f3d991;box-shadow:0 3px 10px #76551d55;transition:.4s}.card{position:absolute;z-index:3;left:7%;right:7%;bottom:6%;min-height:330px;padding:30px 24px;background:#fffaf0;border:2px solid #d7b46a;border-radius:10px;transform:translateY(115px) scale(.93);transition:transform 1s .35s ease,box-shadow .6s;box-shadow:0 10px 22px #563b2730;overflow:hidden}.card:before{content:'🎈  ✨  🎈';display:block;font-size:30px;letter-spacing:8px;margin-bottom:5px}.env.open{height:620px}.env.open .flap{transform:rotateX(180deg);z-index:1}.env.open .seal{opacity:0;transform:translate(-50%,-70%) scale(.5)}.env.open .card{z-index:7;transform:translateY(-180px) scale(1);box-shadow:0 18px 45px #563b2740}.name{font:italic 700 clamp(42px,10vw,68px) Georgia;color:#8e4a5d;margin:2px 0}.turning{letter-spacing:.1em;font-size:20px}.seven{color:#c0983d}.details{margin:18px auto 20px;line-height:1.8;font-size:18px}.place{font-weight:bold}.q{font:600 17px system-ui;margin:14px}.buttons{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:13px 20px;font:bold 14px system-ui;cursor:pointer}.yes{background:#b76b7b;color:white}.no{background:#eee0d5;color:#644}.rsvp{display:none;margin:18px auto 0;max-width:380px}.rsvp input{width:100%;padding:11px 13px;margin:5px 0;border:1px solid #d7bca3;border-radius:10px;font-size:15px}.confirm{margin-top:8px;background:#c49a42;color:white}.msg{display:none;margin-top:18px;padding:15px;border-radius:12px;background:#f7e8ed;font:600 16px system-ui;color:#7d4052}.small{font:13px system-ui;color:#8d7676;margin-top:12px}@media(max-width:520px){.env{height:310px}.env.open{height:610px}.env.open .card{transform:translateY(-145px)}.card{padding:23px 16px}.details{font-size:16px}.name{font-size:46px}}
</style></head>
<body><main class="wrap"><div class="hint" id="hint">A SPECIAL INVITATION • TAP THE ENVELOPE TO OPEN</div>
<section class="env" id="env" aria-label="Birthday invitation envelope">
<div class="back"></div><div class="flap"></div><div class="seal">7</div>
<article class="card">
<div class="turning">LET'S CELEBRATE</div><div class="name">Kritisha</div><div class="turning">IS TURNING <span class="seven">7!</span> 🎂</div>
<div class="details"><strong>Monday, November 9, 2026</strong><br><strong>6:30 PM – 8:30 PM</strong><br><span class="place">📍 5710 Ebner Circle</span></div>
<div class="q">Will you be joining us?</div><div class="buttons" id="choices"><button class="btn yes" onclick="showForm(event)">🎉 YES, WE'LL BE THERE!</button><button class="btn no" onclick="decline(event)">Sorry, we can't make it</button></div>
<div class="rsvp" id="rsvp"><input id="guest" placeholder="Your name" aria-label="Your name"><input id="count" type="number" min="1" max="20" value="1" placeholder="Number attending" aria-label="Number attending"><button class="btn confirm" onclick="confirmRSVP(event)">✓ Confirm attendance</button></div>
<div class="msg" id="msg"></div><div class="small">Cake • Fun • Celebration 🎈</div>
</article><div class="front"></div></section></main>
<script>
const env=document.getElementById('env'),hint=document.getElementById('hint');env.addEventListener('click',()=>{if(!env.classList.contains('open')){env.classList.add('open');hint.textContent='KRITISHA’S 7TH BIRTHDAY INVITATION'}});
function showForm(e){e.stopPropagation();document.getElementById('rsvp').style.display='block';document.getElementById('msg').style.display='none'}
function decline(e){e.stopPropagation();let text='Hi! Thank you for inviting us to Kritisha’s birthday. Unfortunately, we won’t be able to attend. 💕 Hope Kritisha has a wonderful 7th birthday! 🎂';window.location.href='https://wa.me/918219547839?text='+encodeURIComponent(text)}
function confirmRSVP(e){e.stopPropagation();let n=document.getElementById('guest').value.trim()||'Guest',c=document.getElementById('count').value||'1';let text='Hi! 🎉 We’ll be joining Kritisha’s 7th birthday celebration!\n\nName: '+n+'\nNumber attending: '+c+'\n\nSee you on November 9! 🎂🎈';window.location.href='https://wa.me/918219547839?text='+encodeURIComponent(text)}
</script></body></html>
